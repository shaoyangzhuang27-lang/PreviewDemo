message guild_boss
{
	message Record
	{
		int32  id                     = 1 ;		// 拨数
		repeated int32  monster_id    = 2 ;		// 怪ID列表
		repeated int32  monster_level = 3 ;		// 怪等级列表
		int32  battle_level           = 4 ;		// 战斗等级
		float  duration               = 5 ;		// 几秒后自动刷新下一拨
