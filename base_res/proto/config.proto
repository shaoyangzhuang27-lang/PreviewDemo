syntax = "proto3";
package Config;
option csharp_namespace = "Config";
option go_package = "config"
;
message achievement
{
	message Record
	{
		int32  id                    = 1 ;		// ID
		string name                  = 2 ;		// 名称
		string desc                  = 3 ;		// 描述
		int32  type                  = 4 ;		// 类型
		int32  param                 = 5 ;		// 类型参数
		int32  req_num               = 6 ;		// 需求数量
		int32  next_id               = 7 ;		// 后续成就ID
		repeated int32  award_type   = 8 ;		// 奖励物品类型
		repeated int32  award_param1 = 9 ;		// 奖励物品参数
		repeated int32  award_param2 = 10;		// 奖励物品参数
		repeated int32  award_param3 = 11;		// 奖励物品参数
		repeated int32  award_num    = 12;		// 奖励物品数量
		int32  is_deleted            = 13;		// 1代表删除，0不删
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message activity
{
	message Record
	{
		int32  id                          = 1 ;		// ID
		int32  activity_type               = 2 ;		// 活动类型
		string image                       = 3 ;		// 背景图
		string name                        = 4 ;		// 活动名称
		string tittle                      = 5 ;		// 活动标题
		string desc                        = 6 ;		// 文字说明
		string daily_mail_title            = 7 ;		// 每日邮件标题
		string daily_mail_content          = 8 ;		// 每日邮件内容
		repeated int32  mail_award_type    = 9 ;		// 邮件奖励类型
		repeated int32  mail_award_param1  = 10;		// 邮件奖励参数
		repeated int32  mail_award_param2  = 11;		// 邮件奖励参数
		repeated int32  mail_award_param3  = 12;		// 邮件奖励参数
		repeated int32  mail_award_num     = 13;		// 邮件奖励数量
		int32  repeat_times                = 14;		// 循环次数
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message activity_accumulation
{
	message Record
	{
		int32  id                    = 1 ;		// ID
		int32  req_vrmb              = 2 ;		// 需求积累充值
		repeated int32  goods_type   = 3 ;		// 奖励类型
		repeated int32  goods_param1 = 4 ;		// 奖励参数
		repeated int32  goods_param2 = 5 ;		// 奖励参数
		repeated int32  goods_param3 = 6 ;		// 奖励参数
		repeated int32  goods_num    = 7 ;		// 奖励数量
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message activity_quest
{
	message Record
	{
		int32  id                     = 1 ;		// ID
		string desc                   = 2 ;		// 任务描述
		int32  quest_type             = 3 ;		// 任务类型
		int32  param1                 = 4 ;		// 任务类型参数
		int32  param2                 = 5 ;		// 任务类型参数
		int32  require_times          = 6 ;		// 需求次数
		int32  repeat_times           = 7 ;		// 可重复完成次数
		repeated int32  award_type    = 8 ;		// 奖励类型
		repeated int32  award_param1  = 9 ;		// 奖励参数
		repeated int32  award_param2  = 10;		// 奖励参数
		repeated int32  award_param3  = 11;		// 奖励参数
		repeated int32  award_num     = 12;		// 奖励数量
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message activity_rank_award
{
	message Record
	{
		int32  id                     = 1 ;		// ID
		int32  activity_type          = 2 ;		// 活动类型
		int32  req_score              = 3 ;		// 条件积分
		int32  rank_min               = 4 ;		// 最低排名
		int32  rank_max               = 5 ;		// 最高排名
		repeated int32  award_type    = 6 ;		// 奖励类型
		repeated int32  award_param1  = 7 ;		// 奖励参数
		repeated int32  award_param2  = 8 ;		// 奖励参数
		repeated int32  award_param3  = 9 ;		// 奖励参数
		repeated int32  award_num     = 10;		// 奖励数量
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message activity_sell
{
	message Record
	{
		int32  id                    = 1 ;		// ID
		int32  price                 = 2 ;		// 价格
		repeated int32  goods_type   = 3 ;		// 奖励类型
		repeated int32  goods_param1 = 4 ;		// 奖励参数
		repeated int32  goods_param2 = 5 ;		// 奖励参数
		repeated int32  goods_param3 = 6 ;		// 奖励参数
		repeated int32  goods_num    = 7 ;		// 奖励数量
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message aura
{
	message Record
	{
		int32  id                     = 1 ;		// ID
		int32  param                  = 2 ;		// 需求阵营
		int32  num                    = 3 ;		// 需求数量
		string icon                   = 4 ;		// 图标
		string particle               = 5 ;		// 特效
		repeated int32  property_type = 6 ;		// 属性
		repeated float  property_num  = 7 ;		// 属性数值
		float  fighting               = 8 ;		// 战力提升
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message aura_hunting
{
	message Record
	{
		int32  id                     = 1 ;		// ID
		int32  type                   = 2 ;		// 条件类型：1星级，2职业
		int32  param                  = 3 ;		// 条件参数
		int32  num                    = 4 ;		// 需求数量
		repeated int32  property_type = 5 ;		// 属性
		repeated float  property_num  = 6 ;		// 属性数值
		float  fighting               = 7 ;		// 战力提升
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message book_hero_property
{
	message Record
	{
		int32  id                = 1 ;		// ID
		repeated int32  pro_type = 2 ;		// 属性类型列表
		repeated int32  pro_num  = 3 ;		// 属性值列表
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message book_total_property
{
	message Record
	{
		int32  id                     = 1 ;		// ID
		int32  req_point              = 2 ;		// 需求点数
		repeated int32  hero_pro_type = 3 ;		// 英雄属性类型列表
		repeated float  hero_pro_num  = 4 ;		// 英雄属性值列表
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message buff_new
{
	message Record
	{
		int32  id                      = 1 ;		// ID
		string name                    = 2 ;		// 名称
		int32  buff_or_debuff          = 3 ;		// 正面还是负面
		int32  buff_status             = 4 ;		// 状态类型
		int32  max_stack               = 5 ;		// 最大层数
		int32  effect_type             = 6 ;		// 效果类型
		int32  effect_param1           = 7 ;		// 效果参数
		int32  effect_param2           = 8 ;		// 效果参数
		float  effect_levelup          = 9 ;		// 效果等级成长(用于宠物)
		string particle                = 10;		// 特效粒子
		string icon                    = 11;		// 图标
		float  duration                = 12;		// 持续时间
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message challenge_copy
{
	message Record
	{
		int32  id                       = 1 ;		// ID
		int32  req_level                = 2 ;		// 需求等级
		int32  map_id                   = 3 ;		// 地图ID
		int32  reference_power          = 4 ;		// 参考战力
		repeated int32  boss_id         = 5 ;		// BOSSID
		repeated int32  boss_star       = 6 ;		// BOSS星级
		repeated int32  boss_level      = 7 ;		// BOSS等级
		int32  battle_level             = 8 ;		// 战斗等级
		repeated int32  award_type      = 9 ;		// 奖励物品类型
		repeated int32  award_param1    = 10;		// 奖励物品参数
		repeated int32  award_param2    = 11;		// 奖励物品参数
		repeated int32  award_param3    = 12;		// 奖励物品参数
		repeated int32  award_num       = 13;		// 奖励物品数量
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message challenge_extra_award
{
	message Record
	{
		int32  id                    = 1 ;		// ID
		int32  copy_id               = 2 ;		// 副本ID
		repeated int32  award_type   = 3 ;		// 奖励物品类型
		repeated int32  award_param1 = 4 ;		// 奖励物品参数
		repeated int32  award_param2 = 5 ;		// 奖励物品参数
		repeated int32  award_param3 = 6 ;		// 奖励物品参数
		repeated int32  award_num    = 7 ;		// 奖励物品数量
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message copy
{
	message Record
	{
		int32  id                         = 1 ;		// ID
		int32  enemy_kills                = 2 ;		// 怪物波次
		int32  enemy_nums                 = 3 ;		// 怪物数量
		repeated int32  enemy_ids         = 4 ;		// 怪物ID
		repeated int32  enemy_stars       = 5 ;		// 怪物星级
		repeated int32  enemy_levels      = 6 ;		// 怪物等级
		repeated int32  boss_id           = 7 ;		// BOSSID
		repeated int32  boss_star         = 8 ;		// BOSS星级
		repeated int32  boss_level        = 9 ;		// BOSS等级
		int32  battle_level               = 10;		// 战斗等级
		int32  map_id                     = 11;		// 地图ID
		int32  next_id                    = 12;		// 下一张地图ID
		int32  reference_power            = 13;		// 参考战力
		int32  reference_level            = 14;		// 参考等级
		int32  skill_damage_idle          = 15;		// 技能对小怪的伤害百分比
		int32  skill_damage_boss          = 16;		// 技能对BOSS伤害占主角攻击的百分比
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message copy_extra_award
{
	message Record
	{
		int32  id                    = 1 ;		// ID
		int32  copy_id               = 2 ;		// 副本ID
		repeated int32  award_type   = 3 ;		// 奖励物品类型
		repeated int32  award_param1 = 4 ;		// 奖励物品参数
		repeated int32  award_param2 = 5 ;		// 奖励物品参数
		repeated int32  award_param3 = 6 ;		// 奖励物品参数
		repeated int32  award_num    = 7 ;		// 奖励物品数量
		int32  award_show            = 8 ;		// 显示在主UI的奖励idx
		string award_desc            = 9 ;		// 显示在主UI的
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message copy_loot
{
	message Record
	{
		int32  id                          = 1 ;		// ID
		int32  exp                         = 2 ;		// 掉落经验
		int32  money                       = 3 ;		// 掉落金币
		int32  upgrade_point               = 4 ;		// 掉落升级点
		repeated int32  rand_loot_type     = 5 ;		// 随机掉落类型
		repeated int32  rand_loot_param1   = 6 ;		// 随机掉落参数1
		repeated int32  rand_loot_param2   = 7 ;		// 随机掉落参数2
		repeated int32  rand_loot_param3   = 8 ;		// 随机掉落参数3
		repeated int32  rand_loot_num      = 9 ;		// 随机掉落数量
		repeated float  rand_loot_rate     = 10;		// 随机掉落几率
		repeated int32  pass_award_type    = 11;		// 通关奖励类型
		repeated int32  pass_award_param1  = 12;		// 通关奖励参数1
		repeated int32  pass_award_param2  = 13;		// 通关奖励参数2
		repeated int32  pass_award_param3  = 14;		// 通关奖励参数3
		repeated int32  pass_award_num     = 15;		// 通关奖励数量
		int32  pass_reputation             = 16;		// 通关奖励声望
		float  idle_money                  = 17;		// 挂机金币
		float  idle_exp                    = 18;		// 挂机经验
		float  idle_upgrade_point          = 19;		// 挂机升级点
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message country
{
	message Record
	{
		string id            = 1 ;		// 英文缩写
		string name          = 2 ;		// 中文
		int32  area          = 3 ;		// 所属地区id
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message crystal
{
	message Record
	{
		int32  id                     = 1 ;		// ID
		string name                   = 2 ;		// 名字
		int32  quality                = 3 ;		// 品质
		int32  star                   = 4 ;		// 星级
		int32  cost                   = 5 ;		// 价值
		int32  pro_num                = 6 ;		// 属性数量
		int32  upgrade_money          = 7 ;		// 升级所需金币
		int32  upgrade_dust           = 8 ;		// 升级所需材料
		int32  lock_pro_vrmb          = 9 ;		// 锁定属性需求钻石
		int32  convert_money          = 10;		// 转换所需金币
		int32  convert_dust           = 11;		// 转换所需材料
		string icon                   = 12;		// 图片名字
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message daily_recharge_award
{
	message Record
	{
		int32  id                    = 1 ;		// ID
		int32  type                  = 2 ;		// 0新手，1活动
		int32  day                   = 3 ;		// 第几天(0代表最终奖励)
		int32  req_rmb               = 4 ;		// 需求充值数
		repeated int32  award_type   = 5 ;		// 奖励类型
		repeated int32  award_param1 = 6 ;		// 奖励参数
		repeated int32  award_param2 = 7 ;		// 奖励参数
		repeated int32  award_param3 = 8 ;		// 奖励参数
		repeated int32  award_num    = 9 ;		// 奖励数量
		int32  award_value           = 10;		// 奖励价值
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message equip
