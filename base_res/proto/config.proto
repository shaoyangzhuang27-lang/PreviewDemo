message guildConfig
{
	message Record
	{
		int32  id                       = 1 ;		// 编号
		int32  price                    = 2 ;		// 创建公会价格(钻石)
		int32  open_lv                  = 3 ;		// 开放等级
		int32  max_lv                   = 4 ;		// 公会最高级别
		int32  zhaomu                   = 5 ;		// 公会招募间隔（秒）
		int32  sign_times               = 6 ;		// 每日签到次数
		int32  sign_role                = 7 ;		// 签到个人增加的公会币
		int32  sign_guild               = 8 ;		// 签到使公会增加的经验
		int32  mill_lv                  = 9 ;		// 公会磨坊解锁等级
		int32  skill_price              = 10;		// 公会科技重置价格(钻石，第一次免费)
		int32  shop_price               = 11;		// 公会商店充值价格(公会币)
		int32  mill_order_time          = 12;		// 公会磨坊订单生产时间(秒)
		int32  mill_add_one             = 13;		// 公会磨坊捐献一次的数量
		int32  raid_times               = 14;		// 每日可免费打公会副本次数
		repeated int32  raid_cost       = 15;		// 收费打副本消耗
	}
	repeated Record records = 1;
	int64 version           = 2;
}

message guildExpData
{
	message Record
	{
		int32  id                    = 1 ;		// 编号
		repeated int32  cost         = 2 ;		// 升级经验
