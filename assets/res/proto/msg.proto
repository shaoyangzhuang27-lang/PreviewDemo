	EBattleHeroType_Hero = 1;
	EBattleHeroType_Role = 2;
	EBattleHeroType_Monster = 3;
}
message BattleStatisticUnit {
	TBattleUnitType heroType = 1;
	int32 staticID = 2;
	int32 damage = 3;
	int32 heal = 4;
	int32 suffer = 5;
	bool isDead = 6;
}
message CreatePVEBattleR{
	BattlePlayerInfo player = 1;
	TBattleType battleType = 2;
	int32 battleParam = 3;
	int64 battleID = 4;
}
message CreatePVEBattleA{
	TErrorCode err = 1;
	string errStr = 2;	
	int64 battleID = 3;
	int64 playerID = 4;
	TBattleType battleType = 5;
	int32 battleParam = 6;
	TPVPBattleResult result = 7;
	repeated BattleStatisticUnit playerStatistics = 8;
	repeated BattleStatisticUnit monsterStatistics = 9;
}
