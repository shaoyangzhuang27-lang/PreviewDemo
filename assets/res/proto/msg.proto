//PVPReplay回放
message PVPReplay{
	PVPPlayerInfo leftPVPer = 1;//左边选手
	PVPPlayerInfo rightPVPer = 2;//右边选手
	repeated string particleNames = 3;//粒子名字和对应的索引
	map<int32,FrameActions> frameDatas = 4;
}

//PVP选手信息，这个结构跟PVPOpponentInfo一样
message PVPPlayerInfo {
	int64 id = 1;
	string name = 2;
	int32 star = 3;
	repeated HeroInfo heroList = 4;
	map<int64, int32> pvpFormation = 5;
	int32 petId = 6;//!#pet
	int32 armorID = 7;
	int32 armorLevel = 8;
	int32 showTitle = 9;
}

enum TActionType{
	EActionType_Null = 0;
	EActionType_NomalAttacks = 1;//普攻 1//
	EActionType_Particles = 2;//粒子 2//
	EActionType_HpInfo = 3;//血条 3//
	EActionType_EnergyInfo = 4;//能量 4//
	EActionType_TextInfo = 5;//文字 5//
	EActionType_AnimatorInfo = 6;//动画 6//
	EActionType_AgentInfo = 7;//寻路 7//
	EActionType_Teleports = 8;//传送 8
	EActionType_Skill = 9;//技能9
	EActionType_BattleResult = 10;//战斗结果
	EActionType_SetSkin = 11;//皮肤
}
//每个行为
message ActionInfo{
	TActionType type = 1;
	bytes data = 2;
}
//每帧行为
message FrameActions{
	repeated ActionInfo actions = 1;
}

//模型动画状态-----不变-------
enum TAnimatorType{
	EAnimatorType_Idle = 0;
	EAnimatorType_Run = 1;
	EAnimatorType_Die = 2;
	//EAnimatorType_NormalAttack = 3;
	EAnimatorType_Buff = 3;
	EAnimatorType_HuiKan = 4;
	EAnimatorType_TuCi = 5;
	EAnimatorType_ZhenDi = 6;
	EAnimatorType_Attack_1 = 7;
	EAnimatorType_Attack_2 = 8;
	EAnimatorType_Attack_3 = 9;
	EAnimatorType_Attack_4 = 10;
	EAnimatorType_Attack_5 = 11;
	EAnimatorType_PetSkill = 12;
	EAnimatorType_PetFly = 13;
	EAnimatorType_PetIdel = 14;
}

