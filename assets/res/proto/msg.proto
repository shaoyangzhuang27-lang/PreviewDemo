//----------------------------------服务器分布式结构相关 下面是预留的 ---------------------------------------------------

enum TServerType {
	ST_Null = 0;
	ST_Nomal = 1;
	ST_Gateway = 2;
	ST_Logic = 4;
	ST_Global = 8;
}

enum TAgentType{
	AT_ToUp = 0;
	AT_ToDown = 1;
}
enum Ttemp01{
	Null01 = 0;
}
enum Ttemp02{
	Null02 = 0;
}
enum Ttemp03{
	Null03 = 0;
}
enum Ttemp04{
	Null04 = 0;
}
enum Ttemp05{
	Null05 = 0;
}
enum Ttemp06{
	Null06 = 0;
}
enum Ttemp07{
	Null07 = 0;
}
enum Ttemp08{
	Null08 = 0;
}
enum Ttemp09{
	Null09 = 0;
}

//把普通消息进行包装
message SvMsgSendPackMessageR {
	int64 playerId = 1;
	bytes data = 2;
	string err = 3;
	TServerType from = 4;
}

message SvMsgSendPackMessageA {
	int64 playerId = 1;
	bytes data = 2;
	string err = 3;
	TServerType from = 4;
}


//把普通消息打包成一个需要等待回调的消息
message SvMsgWaitIndexMessageR {
	int32 msgIndex = 1;
	bytes data = 2;

}
message SvMsgWaitIndexMessageA {
	int32 msgIndex = 1;
	bytes data = 2;
}

//向其他上级服务器注册自己
message SvMsgRegisterToOtherServerR {
	ServerInfo serverInfo = 1;
}
message SvMsgRegisterToOtherServerA {
	TErrorCode err = 1;
	string strErr = 2;
	TServerType type = 4;
}

//服务器信息
message ServerInfo {
	TServerType type = 1;
	string addr = 2;
	int32 serverId = 3;
}

//告诉下级服务器，需要增加新的连接agent
message SvDownAskForConnAgent {
	ServerInfo svInfo = 1;
	int32 agentCount = 3;
}

//请求所有logic服务器的信息
message SvMsgGetLogicServerInfosR {
}
message SvMsgGetLogicServerInfosA {
	repeated ServerInfo logicServers = 3;
}

//gateway 到 global登录的应答消息
message SvMsgGlobalLoginA {
	TErrorCode err = 1;
	string errStr = 2;
	int64 loginPlayerID = 3;
	int32 serverID = 4;
	repeated PlayerBriefInfo allPlayerList = 5;
}


//通知logic服创建新角色
message SvWmCreateNewPlayerR {
	int64 playerId = 1;
	string region = 2;
}
message SvWmCreateNewPlayerA {
	TErrorCode err = 1;
	SvPlayerInfo playerInfo = 2;
}

//获得player信息，根据深度获取程度不同
message SvWmGetPlayerInfoR {
	int64 playerId = 1;
	int32 infoDeepness = 2;//获取消息深度，深度越高获取的信息越详细,mask值，1248
}

message SvWmGetPlayerInfoA {
	TErrorCode err = 1;
	SvPlayerInfo playerInfo = 2;
}
message SvPlayerInfo {

	int64 id = 101;
	string name = 102;
	int32 level = 103;
	int32 star = 104;
	int32 portrait = 105;
	string region = 106;
	int32 serverId = 107;
	int32 guildId = 108;
	string mac = 109;
	int32 VipLevel = 110;
	int32 MaxFighting = 111;
	int32 CopyId = 112;
	string Channel = 113;
	int32 LastLogoutTimestamp = 114;

	repeated HeroInfo heroList = 201;
	map<int64, int32> pvpFormation = 202;
	PetInfo pet = 203;//!#pet
	int32 fighting = 204;

	int32 guildLv = 301;
	int32 afkTime = 302;
	int64 GuildMillNum = 303;
	int32 GuildApplyCount = 304;
	int32 Vrmb = 305;
	int32 GuildSign = 306;
}

//logic从登录信息里获取数据，通知给global//这里还得检查公会会长信息是否正确
message SvWmPlayerLoginR {
	SvPlayerInfo playerInfo = 1;
}

//返回登录信息，如果err不是ok，则表示更新公会会长信息
message SvWmPlayerLoginA {
	TErrorCode err = 1;
	int32 guildId = 2;
	int32 guildLv = 3;
	string accountId = 4;//把账号信息带回来
}


//gateway通知logic下线id，logic通知global用户下线，并发送数据
message SvNtsPlayerLogout {
	int64 playerId = 1;
	SvPlayerInfo playerInfo = 2;
}

//获取player所在的服务器id
message SvWmGetPlayerServerR {
	int64 playerId = 1;
}
message SvWmGetPlayerServerA {
	TErrorCode err = 1;
	int32 serverId = 2;
}

//全服通知分服增加一个global mail
message SvNtsAddGlobalMail {
	MailInfo mail = 1;
	int64 startTime = 2;
	int64 endTime = 3;
}
//给客户端群发消息//可以用作聊天群发，和其他群发功能
message SvNtsMsgToClient {
	bytes msgData = 1;
	repeated int64 recivedPlayerIds = 2;
	int64 excludeId = 3;//不接收的player id
	
}

//logic通知global，player信息改变了
message SvNtsPlayerBaseInfo {
	SvPlayerInfo info = 1;
}

//global通知logic，player公会信息变了
message SvNtsPlayerGuildInfo {
	int64 playerId = 1;
	int32 guildId = 2;
	int32 guildLv = 3;
	TGuildType type = 4;
}

//通知global公会经验增加
message SvNtsAddGuildExp {
	int32 guildId = 1;
	int32 addExp = 2;
}
message SvFriendInfo {
	int64 playerId = 1;
	string name = 2;
	int32 level = 3;
	int32 Portrait = 4;
	int32 LastLogoutTimestamp = 5;
	int32 star = 6;
}

//获得所有好友信息
message SvWmGetFriendInfoR {
	int64 selfId = 1;
	repeated int64 playerIds = 2;
}
message SvWmGetFriendInfoA {
	repeated SvFriendInfo infos = 1;
	repeated SvFriendInfo RecommandInfos = 2;
}

//通知好友送礼
message SvNtsSendFriendGift {
	int64 sendId = 1;
	repeated int64 revicedIds = 2;
}

//请求添加好友
message SvNtsRequireFriend {
	int64 revicedId = 1;
	int64 sendId = 2;
	FriendRequest friend = 3;
}

//同意请求添加好友
message SvWmAcceptFriendRequestR {
	int64 requestId = 1;
	int64 responseId = 2;
	FriendDetailInfo responseInfo = 3;
}

message SvWmAcceptFriendRequestA {
	TErrorCode err = 1;
	FriendDetailInfo requestInfo = 2;
}

//删除好友
message SvNtsDeleteFriend {
	int64 playerId = 1;
	int64 deleteId = 2;
}

message SvWmGetGMPlayerDataR {
	int64 playerId = 1;
}
message SvWmGetGMPlayerDataA {
	TErrorCode err = 1;
	GMPlayerData data = 2;
}

